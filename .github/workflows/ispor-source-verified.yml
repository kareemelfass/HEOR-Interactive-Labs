name: Legacy archive graph (manual audit only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ispor-source-write
  cancel-in-progress: false

jobs:
  source-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build graph from pinned source, refusing schema or count changes
        run: python ispor-intelligence/scripts/build_source_graph.py
      - name: Independently validate all 3097 records and every relationship
        run: python ispor-intelligence/scripts/verify_source_graph.py
      - name: Preserve results as inspection-only artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ispor-single-purpose-audit-${{ github.run_id }}
          path: |
            ispor-intelligence/data/source-*.json
          if-no-files-found: warn
          retention-days: 14
