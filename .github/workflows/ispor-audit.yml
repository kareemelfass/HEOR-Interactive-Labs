name: Audit ISPOR research atlas data integrity

on:
  push:
    branches: [main]
    paths:
      - "ispor-intelligence/scripts/audit_integrity_readonly.py"
      - ".github/workflows/ispor-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-source-versus-published-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit full indexed archive and KG without modifying published data
        run: python ispor-intelligence/scripts/audit_integrity_readonly.py
