name: Validate official-source ISPOR dashboard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public HEOR site and exclude private atlas
        run: |
          test -s index.html
          test ! -e ispor-intelligence
          echo "PUBLIC_LABS_VALIDATED_PRIVATE_ATLAS_EXCLUDED"
