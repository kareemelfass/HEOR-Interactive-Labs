name: Discover official ISPOR search source
on:
  push:
    branches: [main]
    paths:
      - "ispor-intelligence/scripts/inspect_official_api.py"
      - ".github/workflows/ispor-discover-api.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read search query configuration from ISPOR's own public site
        run: python ispor-intelligence/scripts/inspect_official_api.py
