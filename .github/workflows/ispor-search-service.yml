name: Probe official ISPOR conference search API
on:
  push:
    branches: [main]
    paths:
      - "ispor-intelligence/scripts/probe_search_service.py"
      - ".github/workflows/ispor-search-service.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ispor-intelligence/scripts/probe_search_service.py
