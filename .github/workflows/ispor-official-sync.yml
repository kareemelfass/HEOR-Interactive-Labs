name: Build official ISPOR 2026 search-index dataset
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ispor-source-write
  cancel-in-progress: false

jobs:
  index-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax before contacting the source
        run: python -m py_compile ispor-intelligence/scripts/sync_official_index.py
      - name: Fetch every current ISPOR search-index result and reconcile archive
        run: python ispor-intelligence/scripts/sync_official_index.py
      - name: Validate official-index integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("ispor-intelligence/data")
          r=json.loads((p/"official-index-records.json").read_text())
          g=json.loads((p/"official-index-graph.json").read_text())
          q=json.loads((p/"official-reconciliation.json").read_text())
          s=json.loads((p/"official-index-summary.json").read_text())
          m=json.loads((p/"official-index-scan-manifest.json").read_text())
          rec=r["records"]
          assert len(rec)==r["metadata"]["records"]==len(set(x["uid"] for x in rec))
          assert len(rec)==len(set(x["url"] for x in rec))
          ids={n["id"] for n in g["nodes"]}
          assert len(ids)==len(g["nodes"])
          assert all(e["source"] in ids and e["target"] in ids for e in g["edges"])
          assert all(not e["provenance"]["inferred"] for e in g["edges"])
          assert len(q["archive_to_official"])==q["archive_records"]
          assert len(m["record_membership"])==len(rec)
          assert all(uid in m["record_membership"] for uid in [r["uid"] for r in rec])
          assert all(r["seen_in_scans"]==m["record_membership"][r["uid"]] for r in rec)
          assert len(m["pages"]) >= m["metadata"]["capture_scans"]
          assert sum(n["type"]=="presentation" for n in g["nodes"])==sum(r["index_content_kind"]=="Confex Presentation" for r in rec)
          assert sum(n["type"]=="session" for n in g["nodes"])==sum(r["index_content_kind"]=="Confex Session" for r in rec)
          assert all(x["record_source"]=="ISPOR website configured SearchBlox index" for x in rec)
          assert all(not x["official_detail_link_present"] or x["url"].startswith("https://www.ispor.org/heor-resources/presentations-database/presentation-cti/ispor-europe-2026/") for x in rec)
          assert all(x["event"]=="2026-11, ISPOR Europe 2026, Vienna, Austria" for x in rec)
          assert s["comparison"]["official_index_records"]==len(rec)
          print("OFFICIAL_INDEX_VALIDATION",{"records":len(rec),"graph_nodes":len(ids),"graph_edges":len(g["edges"]),"archive_comparison":s["comparison"]})
          PY
      - name: Preserve results as inspection-only artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ispor-single-purpose-audit-${{ github.run_id }}
          path: |
            ispor-intelligence/data/official-index-*.json
            ispor-intelligence/data/official-reconciliation.json
          if-no-files-found: warn
          retention-days: 14
