name: One-time retired atlas history cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-retired-atlas-history.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: retired-atlas-history-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.before == '15d6cba72511cd57643b361cf8fe1f86b96c2f6f'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install history filter and copy authenticated checkout
        run: |
          python -m pip install --disable-pip-version-check git-filter-repo
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          while read -r ref sha; do
            branch="${ref#refs/remotes/origin/}"
            if [ "$branch" != HEAD ]; then
              git update-ref "refs/heads/$branch" "$sha"
            fi
          done < <(git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin)
          git clone --bare --no-local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/cleanup.git"

      - name: Remove only retired atlas directory and verify every branch and tag
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cleanup.git"
          git for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags > "$RUNNER_TEMP/original-refs"
          test "$(git rev-parse refs/heads/main)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/expected-trees"
          i=0
          while read -r ref sha; do
            i=$((i+1))
            git ls-tree -r --full-tree "$ref^{tree}" | awk -F '\t' '$2 !~ /^ispor-intelligence\//' > "$RUNNER_TEMP/expected-trees/$i"
          done < "$RUNNER_TEMP/original-refs"

          git filter-repo --force --path ispor-intelligence/ --invert-paths --prune-empty never --prune-degenerate never
          test -z "$(git log --all --format=%H -- ispor-intelligence/)"
          i=0
          leases=()
          refspecs=()
          while read -r ref sha; do
            i=$((i+1))
            new="$(git rev-parse "$ref")"
            git ls-tree -r --full-tree "$ref^{tree}" > "$RUNNER_TEMP/actual-tree"
            cmp "$RUNNER_TEMP/expected-trees/$i" "$RUNNER_TEMP/actual-tree"
            if [ "$sha" != "$new" ]; then
              leases+=("--force-with-lease=$ref:$sha")
              refspecs+=("$ref:$ref")
            fi
            echo "VERIFIED_UNRELATED_FILES_UNCHANGED $ref $new"
          done < "$RUNNER_TEMP/original-refs"

          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)"
          test -n "$auth"
          git config http.https://github.com/.extraheader "$auth"
          unset auth
          if [ "${#refspecs[@]}" -gt 0 ]; then
            git push --atomic "${leases[@]}" origin "${refspecs[@]}"
          fi
          while read -r ref sha; do
            expected="$(git rev-parse "$ref")"
            actual="$(git ls-remote origin "$ref" | awk '{print $1}')"
            test "$actual" = "$expected"
          done < "$RUNNER_TEMP/original-refs"
          echo "PUBLIC_BRANCH_AND_TAG_HISTORY_CLEANED"
          echo "NOTE: server-retained PR refs and caches are outside this rewrite."

      - name: Remove old public atlas and Pages artifacts
        shell: bash
        run: |
          set -euo pipefail
          cutoff="2026-11-21T19:30:25Z"
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | select((.name | ascii_downcase | contains(\"ispor\")) or .name == \"github-pages\") | .id" > "$RUNNER_TEMP/old-artifacts"
          while read -r id; do
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id" --silent
            echo "DELETED_OLD_ARTIFACT $id"
          done < "$RUNNER_TEMP/old-artifacts"
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.created_at < \"$cutoff\" and .status == \"completed\") | select(.name | ascii_downcase | contains(\"ispor\")) | .id" > "$RUNNER_TEMP/old-runs"
          while read -r id; do
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/runs/$id" --silent
            echo "DELETED_OLD_ATLAS_RUN $id"
          done < "$RUNNER_TEMP/old-runs"
          echo "OLD_PUBLIC_ARTIFACT_CLEANUP_COMPLETE"

      - name: Revalidate public lab deployment
        run: gh workflow run ispor-verify-official-ui.yml --ref main
