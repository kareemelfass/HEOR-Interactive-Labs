name: Probe ISPOR missing-presentation recovery
on:
  push:
    branches: [main]
    paths:
      - "ispor-intelligence/scripts/probe_recovery.py"
      - ".github/workflows/ispor-recovery-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile ispor-intelligence/scripts/probe_recovery.py
      - run: python ispor-intelligence/scripts/probe_recovery.py
