name: Verify archive URL response observations (manual only)
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ispor-source-write
  cancel-in-progress: false

jobs:
  verify-discrepancies:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax validation
        run: python -m py_compile ispor-intelligence/scripts/verify_discrepant_pages.py
      - name: Verify every non-identical archive record against ISPOR pages
        run: python ispor-intelligence/scripts/verify_discrepant_pages.py
      - name: Audit classification counts and source link integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("ispor-intelligence/data")
          recon=json.loads((p/"official-reconciliation.json").read_text())
          audit=json.loads((p/"official-page-checks.json").read_text())
          expected=sum(r["status"]!="url_match" for r in recon["archive_to_official"])
          assert len(audit["results"])==expected
          assert sum(audit["counts"].values())==expected
          assert len({(r["archive_code"],r["archive_url"]) for r in audit["results"]})==expected
          assert all(r["page_status"]!="official_page_title_code_verified" or
                     (r["title_match"] and r["code_match"] and r["http_status"]==200)
                     for r in audit["results"])
          print("OFFICIAL_DISCREPANCY_AUDIT_PASS",audit["counts"])
          PY
      - name: Commit page-by-page official discrepancy verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ispor-intelligence/data/official-page-checks.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record official-page audit for each ISPOR archive discrepancy"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then echo "OFFICIAL_PAGE_AUDIT_PUBLISHED"; exit 0; fi
            sleep 3
          done
          exit 1
