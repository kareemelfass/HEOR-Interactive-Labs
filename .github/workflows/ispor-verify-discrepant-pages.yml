name: Recheck archived ISPOR URLs conservatively (manual only)
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ispor-source-write
  cancel-in-progress: false

jobs:
  verify-discrepancies:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax validation
        run: python -m py_compile ispor-intelligence/scripts/verify_discrepant_pages.py
      - name: Verify every non-identical archive record against ISPOR pages
        run: python ispor-intelligence/scripts/verify_discrepant_pages.py
      - name: Audit classification counts and source link integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("ispor-intelligence/data")
          recon=json.loads((p/"official-reconciliation.json").read_text())
          audit=json.loads((p/"official-page-recheck-latest.json").read_text())
          expected=sum(r["status"]!="url_match" for r in recon["archive_to_official"])
          assert len(audit["results"])==expected
          assert audit["metadata"]["repeated_404_does_not_prove_presentation_absence"]
          assert sum(audit["counts"].values())==expected
          assert len({(r["archive_code"],r["archived_url"]) for r in audit["results"]})==expected
          assert all(r["classification"]!="repeated_http_404_unconfirmed" or
                     len(r["observations"])==3 and all(a.get("http_status")==404 for a in r["observations"])
                     for r in audit["results"])
          print("OFFICIAL_DISCREPANCY_AUDIT_PASS",audit["counts"])
          PY
      - name: Commit page-by-page official discrepancy verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ispor-intelligence/data/official-page-recheck-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record conservative archived-URL recheck with original observations preserved"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then echo "OFFICIAL_PAGE_AUDIT_PUBLISHED"; exit 0; fi
            sleep 3
          done
          exit 1

      - name: Dispatch validation after GITHUB_TOKEN writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ispor-verify-official-ui.yml --ref main
