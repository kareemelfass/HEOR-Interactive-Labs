name: Verify sample directly against ISPOR official database

on:
  push:
    branches: [main]
    paths:
      - "ispor-intelligence/scripts/check_official_pages.py"
      - ".github/workflows/ispor-official-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-official-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read authoritative ISPOR pages and report mismatches
        run: python ispor-intelligence/scripts/check_official_pages.py
