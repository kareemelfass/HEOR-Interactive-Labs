name: Publish individually verified ISPOR page supplement
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ispor-source-write
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build from directly checked official pages only
        run: |
          python -m py_compile ispor-intelligence/scripts/build_official_supplement.py
          python ispor-intelligence/scripts/build_official_supplement.py
      - name: Verify supplement does not contaminate official index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("ispor-intelligence/data")
          x=json.loads((base/"official-page-verified-supplement.json").read_text())
          s=json.loads((base/"official-index-summary.json").read_text())
          assert x["metadata"]["not_added_to_search_index_denominator"]
          assert x["metadata"]["count"]==len(x["records"])
          assert s["metadata"]["records"]>=2500
          assert all(r["verdict"]=="verified_official_page_absent_from_captured_search_index" for r in x["records"])
          print("OFFICIAL_PAGE_SUPPLEMENT_VALIDATED",len(x["records"]))
          PY
      - name: Preserve results as inspection-only artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ispor-single-purpose-audit-${{ github.run_id }}
          path: |
            ispor-intelligence/data/official-page-verified-supplement.json
          if-no-files-found: warn
          retention-days: 14
