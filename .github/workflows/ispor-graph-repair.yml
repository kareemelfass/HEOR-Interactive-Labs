name: Repair ISPOR source graph node types

on:
  pull_request:
    branches: [main]
    paths:
      - "ispor-intelligence/scripts/repair_official_graph.py"
      - ".github/workflows/ispor-graph-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ispor-source-write
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair typed nodes and validate all source-field edges
        run: |
          python -m py_compile ispor-intelligence/scripts/repair_official_graph.py
          python ispor-intelligence/scripts/repair_official_graph.py
          python -m unittest discover -s ispor-intelligence/tests -v
      - name: Commit corrected graph to the same reviewed branch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ispor-intelligence/data/official-index-graph.json
          if git diff --cached --quiet; then
            echo "ISPOR_GRAPH_ALREADY_REPAIRED"
            exit 0
          fi
          git commit -m "Correct 139 official ISPOR session nodes to session source type"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "ISPOR_GRAPH_REPAIR_COMMITTED_TO_REVIEW_BRANCH"
