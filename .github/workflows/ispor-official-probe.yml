name: Inspect official ISPOR results API
on:
  push:
    branches: [main]
    paths:
      - "ispor-intelligence/scripts/probe_official_search.py"
      - ".github/workflows/ispor-official-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public official search and script endpoint hints
        run: python ispor-intelligence/scripts/probe_official_search.py
